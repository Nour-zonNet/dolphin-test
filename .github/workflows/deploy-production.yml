name: Deploy to Production (app.learnadolphin.com)

on:
  workflow_dispatch:
    branches:
      - production
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean
      confirmation:
        description: 'Type "DEPLOY_TO_PRODUCTION" to confirm'
        required: true
        type: string

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate branch
        if: ${{ github.ref_name != 'production' }}
        run: |
          echo "❌ This workflow can only be run from the 'production' branch."
          echo "Current branch: ${{ github.ref_name }}"
          echo "Required branch: production"
          exit 1

      - name: Validate confirmation
        if: ${{ inputs.confirmation != 'DEPLOY_TO_PRODUCTION' }}
        run: |
          echo "❌ Invalid confirmation. Please type 'DEPLOY_TO_PRODUCTION' to confirm deployment."
          exit 1

      - name: Validate environment
        if: ${{ inputs.environment != 'production' }}
        run: |
          echo "❌ Invalid environment selected."
          exit 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-${{ github.run_number }}
          path: |
            dist/
            build/
          retention-days: 30

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: always() && (needs.validate.result == 'success') && (needs.test.result == 'success' || inputs.skip_tests)

    environment:
      name: production
      url: https://app.learnadolphin.com

    steps:
      - name: Send deployment start notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL || '#deployments' }}",
              "attachments": [{
                "color": "warning",
                "title": "🚀 Production Deployment Started",
                "fields": [
                  {
                    "title": "Repository",
                    "value": "${{ github.repository }}",
                    "short": true
                  },
                  {
                    "title": "Branch",
                    "value": "${{ github.ref_name }}",
                    "short": true
                  },
                  {
                    "title": "Triggered by",
                    "value": "${{ github.actor }}",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "⏳ Starting deployment to app.learnadolphin.com...",
                    "short": false
                  }
                ],
                "footer": "GitHub Actions | Production Deployment",
                "ts": $(date +%s)
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deployment info
        run: |
          echo "Environment: Production" > deployment-info.txt
          echo "Branch: ${{ github.ref_name }}" >> deployment-info.txt
          echo "Commit: ${{ github.sha }}" >> deployment-info.txt
          echo "Time: $(date)" >> deployment-info.txt
          echo "Deployed by: ${{ github.actor }}" >> deployment-info.txt
          echo "Event: ${{ github.event_name }}" >> deployment-info.txt
          echo "Build Number: ${{ github.run_number }}" >> deployment-info.txt

      - name: Deploy via FTP to Production
        id: deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.PROD_FTP_HOST }}
          port: ${{ secrets.PROD_FTP_PORT }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          local-dir: './dist/'
          server-dir: './'
          exclude: |
            **/.git*
            **/node_modules/**
            **/.env*
            **/tests/**
            **/*.test.*
            **/*.spec.*
            **/.DS_Store
          state-name: '.ftp-deploy-sync-state-prod.json'
          log-level: 'standard'

      - name: Upload deployment info to Production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.PROD_FTP_HOST }}
          port: ${{ secrets.PROD_FTP_PORT }}
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          local-dir: './'
          server-dir: './'
          exclude: |
            **/*
            !deployment-info.txt

      - name: Verify production deployment
        id: verify
        run: |
          echo "Verifying production deployment..."
          sleep 15
          if curl -f -s -o /dev/null https://app.learnadolphin.com; then
            echo "verification=success" >> $GITHUB_OUTPUT
            echo "✅ Production site is accessible"
          else
            echo "verification=failed" >> $GITHUB_OUTPUT
            echo "❌ Production site verification failed"
            exit 1
          fi

  notify:
    name: Send Final Notification
    runs-on: ubuntu-latest
    needs: [validate, test, deploy]
    if: always()

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
            echo "message=✅ Production deployment completed successfully!" >> $GITHUB_OUTPUT
            echo "details=✅ Production deployment completed successfully! Site is live at https://app.learnadolphin.com" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.deploy.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed!" >> $GITHUB_OUTPUT
            echo "details=❌ Production deployment failed! Please check the logs and try again." >> $GITHUB_OUTPUT
          elif [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "status=validation_failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
            echo "message=❌ Deployment validation failed!" >> $GITHUB_OUTPUT
            echo "details=❌ Deployment validation failed! Please check your inputs." >> $GITHUB_OUTPUT
          else
            echo "status=cancelled" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
            echo "message=⚠️ Deployment was cancelled!" >> $GITHUB_OUTPUT
            echo "details=⚠️ Production deployment was cancelled or skipped!" >> $GITHUB_OUTPUT
          fi

      - name: Send final Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL || '#deployments' }}",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "title": "🚀 Production Deployment Result",
                "fields": [
                  {
                    "title": "Repository",
                    "value": "${{ github.repository }}",
                    "short": true
                  },
                  {
                    "title": "Branch",
                    "value": "${{ github.ref_name }}",
                    "short": true
                  },
                  {
                    "title": "Commit",
                    "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                    "short": true
                  },
                  {
                    "title": "Deployed by",
                    "value": "${{ github.actor }}",
                    "short": true
                  },
                  {
                    "title": "Build Number",
                    "value": "${{ github.run_number }}",
                    "short": true
                  },
                  {
                    "title": "Environment",
                    "value": "🔴 PRODUCTION",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "${{ steps.status.outputs.message }}",
                    "short": false
                  },
                  {
                    "title": "Details",
                    "value": "${{ steps.status.outputs.details }}",
                    "short": false
                  }
                ],
                "footer": "GitHub Actions | Learnat Dolphin Platform",
                "ts": $(date +%s)
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
